version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    volumes:
      # Optional: Mount for logs/data if your app generates files
      - ./logs:/app/logs
    # Uncomment to mount scripts directory for development
    # volumes:
    #   - ./dist/scripts:/app/bin
